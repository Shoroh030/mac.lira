plugins {
    id 'com.android.application'
}

def supabaseUrl = System.getenv('SUPABASE_URL') ?: 'https://vdmcaltwnhlqrvwvchwi.supabase.co'
def supabasePublishableKey = System.getenv('SUPABASE_PUBLISHABLE_KEY') ?: 'sb_publishable_76yRmXfDmV8TTvsCu9kW6Q_5VfHkay-'
def appVersionName = System.getenv('APP_VERSION') ?: '1.3.10'
def appVersionCode = (System.getenv('APP_VERSION_CODE') ?: '23') as Integer

android {
    namespace 'com.lira.vmest'
    compileSdk 34

    buildFeatures { buildConfig true }

    defaultConfig {
        applicationId 'com.lira.vmest'
        minSdk 24
        targetSdk 34
        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
        versionCode appVersionCode
        versionName appVersionName
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        buildConfigField 'String', 'SUPABASE_URL', '"' + supabaseUrl + '"'
        buildConfigField 'String', 'SUPABASE_PUBLISHABLE_KEY', '"' + supabasePublishableKey + '"'
    }

    signingConfigs {
        release {
            def keystorePath = System.getenv('VMEST_KEYSTORE_PATH')
            def releaseStorePassword = System.getenv('VMEST_KEYSTORE_PASSWORD') ?: ''
            def releaseKeyAlias = System.getenv('VMEST_KEY_ALIAS') ?: ''
            def releaseKeyPassword = System.getenv('VMEST_KEY_PASSWORD') ?: ''
            if (keystorePath != null && new File(keystorePath).exists()) {
                storeFile file(keystorePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        release {
            if (System.getenv('VMEST_KEYSTORE_PATH') != null && new File(System.getenv('VMEST_KEYSTORE_PATH')).exists()) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            shrinkResources false
        }
        debug {
            minifyEnabled false
            shrinkResources false
        }
    }
}

dependencies {
    implementation 'io.github.webrtc-sdk:android:150.7871.04'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation 'androidx.core:core:1.12.0'
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'androidx.media3:media3-exoplayer:1.3.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.3.1'
    implementation 'androidx.media3:media3-ui:1.3.1'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
}
