name: Android release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare version and signing key
        id: signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.VMEST_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.VMEST_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.VMEST_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.VMEST_KEY_PASSWORD }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "Release tags must use vMAJOR.MINOR or vMAJOR.MINOR.PATCH." >&2
            exit 1
          fi
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "Configure VMEST_KEYSTORE_BASE64, VMEST_KEYSTORE_PASSWORD, VMEST_KEY_ALIAS and VMEST_KEY_PASSWORD in repository Actions secrets before creating a release tag." >&2
            exit 1
          fi
          if ! printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/vmeste-release.keystore"; then
            echo "VMEST_KEYSTORE_BASE64 is not valid Base64." >&2
            exit 1
          fi
          if [ ! -s "$RUNNER_TEMP/vmeste-release.keystore" ] ||
            ! keytool -list -keystore "$RUNNER_TEMP/vmeste-release.keystore" \
              -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            echo "The keystore file, password or alias is invalid." >&2
            exit 1
          fi
          echo "VMEST_KEYSTORE_PATH=$RUNNER_TEMP/vmeste-release.keystore" >> "$GITHUB_ENV"
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"
          echo "APP_VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
      - name: Build signed APK
        env:
          VMEST_KEYSTORE_PASSWORD: ${{ secrets.VMEST_KEYSTORE_PASSWORD }}
          VMEST_KEY_ALIAS: ${{ secrets.VMEST_KEY_ALIAS }}
          VMEST_KEY_PASSWORD: ${{ secrets.VMEST_KEY_PASSWORD }}
        run: bash ./desktop/gradlew -p . :together:assembleRelease
      - name: Name APK for in-app updater
        run: |
          cp together/build/outputs/apk/release/together-release.apk "together/build/outputs/apk/release/together-${APP_VERSION}.apk"
          cp together/build/outputs/apk/release/together-${APP_VERSION}.apk together/build/outputs/apk/release/together-latest.apk
      - name: Verify release signing certificate
        shell: bash
        env:
          PRODUCTION_CERT_SHA256: ${{ vars.VMEST_PRODUCTION_CERT_SHA256 }}
        run: |
          sdk_root="${ANDROID_HOME:-}"
          if [ ! -d "$sdk_root/build-tools" ]; then
            sdk_root="${ANDROID_SDK_ROOT:-}"
          fi
          if [ ! -d "$sdk_root/build-tools" ]; then
            sdk_root="/usr/local/lib/android/sdk"
          fi
          if [ ! -d "$sdk_root/build-tools" ]; then
            echo "Android SDK build-tools were not found." >&2
            exit 1
          fi
          signer="$(find "$sdk_root/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [ -z "$signer" ]; then
            echo "apksigner was not found in Android SDK build-tools." >&2
            exit 1
          fi
          verification="$("$signer" verify --print-certs "together/build/outputs/apk/release/together-${APP_VERSION}.apk" 2>&1)"
          printf '%s\n' "$verification"
          actual="$(printf '%s\n' "$verification" | sed -nE 's/.*certificate SHA-256 digest: ([[:xdigit:]]{64}).*/\1/ip' | head -n 1 | tr '[:upper:]' '[:lower:]')"
          if [ -z "$actual" ]; then
            echo "Could not read the APK signing certificate." >&2
            exit 1
          fi
          if printf '%s\n' "$verification" | grep -iqE 'certificate DN:.*CN=Android Debug'; then
            echo "Refusing to publish an APK signed with the Android debug certificate." >&2
            exit 1
          fi
          expected="$(printf '%s' "$PRODUCTION_CERT_SHA256" | tr '[:upper:]' '[:lower:]')"
          if [[ ! "$expected" =~ ^[[:xdigit:]]{64}$ ]]; then
            echo "Configure the VMEST_PRODUCTION_CERT_SHA256 repository variable before publishing." >&2
            exit 1
          fi
          echo "Release APK signer SHA-256: $actual"
          if [ "$actual" != "$expected" ]; then
            echo "Release APK signing certificate does not match existing app installations." >&2
            exit 1
          fi
      - name: Verify 16 KB compatibility
        shell: pwsh
        run: |
          $sdk = $env:ANDROID_HOME
          if (-not (Test-Path (Join-Path $sdk "build-tools"))) { $sdk = $env:ANDROID_SDK_ROOT }
          $zipAlign = Get-ChildItem (Join-Path $sdk "build-tools") -Filter zipalign -Recurse |
            Sort-Object FullName | Select-Object -Last 1
          if (-not $zipAlign) { throw "Android SDK zipalign was not found." }
          & ./together/scripts/check-16kb-compatibility.ps1 `
            -ApkPath "together/build/outputs/apk/release/together-${env:APP_VERSION}.apk" `
            -ZipAlignPath $zipAlign.FullName
      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          name: "I'm Here ${{ github.ref_name }}"
          generate_release_notes: true
          overwrite_files: true
          files: |
            together/build/outputs/apk/release/together-${{ env.APP_VERSION }}.apk
            together/build/outputs/apk/release/together-latest.apk
      - name: Remove temporary signing key
        if: always()
        run: |
          if [ -n "$VMEST_KEYSTORE_PATH" ]; then
            rm -f "$VMEST_KEYSTORE_PATH"
          fi
